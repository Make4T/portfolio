<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" role="img" aria-labelledby="title desc">
  <title id="title">Game Session API</title>
  <desc id="desc">A .NET game session API connecting game clients to REST endpoints and a SQLite database.</desc>
