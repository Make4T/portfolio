<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" role="img" aria-labelledby="title desc">
  <title id="title">TypeScript game event dashboard</title>
  <desc id="desc">A dark game operations dashboard with telemetry charts, event filters and player data.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d3542"/><stop offset="1" stop-color="#071017"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0v36" fill="none" stroke="#5be5d3" stroke-opacity=".06"/></pattern>
  </defs>
  <rect width="900" height="720" fill="url(#bg)"/><rect width="900" height="720" fill="url(#grid)"/>
  <text x="55" y="72" fill="#6ee7d8" font-family="monospace" font-size="18" letter-spacing="4">TYPESCRIPT / REACT // EVENT SCOPE</text>
  <g transform="translate(55 122)">
    <rect width="790" height="480" rx="12" fill="#091a24" stroke="#2f6b76"/>
    <rect width="790" height="48" rx="12" fill="#0d2632"/><path d="M0 48h790" stroke="#2f6b76"/>
    <text x="30" y="30" fill="#e1f7f5" font-family="monospace" font-size="17">Event<tspan fill="#49dcc8">Scope</tspan></text>
    <circle cx="660" cy="24" r="5" fill="#49dcc8"/><text x="676" y="28" fill="#94bdc5" font-family="monospace" font-size="11">LIVE TELEMETRY</text>
    <g transform="translate(28 78)">
      <text fill="#a7cfd3" font-family="monospace" font-size="12">SESSION TELEMETRY</text><text y="38" fill="#f0fbfa" font-family="sans-serif" font-size="28" font-weight="700">Northstar relay</text>
      <g transform="translate(0 65)">
        <rect width="168" height="72" fill="#102b35" stroke="#24535e"/><rect x="184" width="168" height="72" fill="#102b35" stroke="#24535e"/><rect x="368" width="168" height="72" fill="#102b35" stroke="#24535e"/>
        <text x="15" y="22" fill="#8eb4bc" font-family="monospace" font-size="10">EVENTS CAPTURED</text><text x="15" y="54" fill="#f0fbfa" font-family="sans-serif" font-size="25" font-weight="700">1,248</text>
        <text x="199" y="22" fill="#8eb4bc" font-family="monospace" font-size="10">OBJECTIVE RATE</text><text x="199" y="54" fill="#f0fbfa" font-family="sans-serif" font-size="25" font-weight="700">72.8%</text>
        <text x="383" y="22" fill="#8eb4bc" font-family="monospace" font-size="10">MEDIAN LATENCY</text><text x="383" y="54" fill="#f0fbfa" font-family="sans-serif" font-size="25" font-weight="700">34ms</text>
      </g>
      <g transform="translate(0 168)"><rect width="520" height="176" fill="#0c222c" stroke="#24535e"/><text x="15" y="24" fill="#d8f4ef" font-family="sans-serif" font-size="15" font-weight="700">Activity pulse</text><g transform="translate(17 155)" fill="#43d8c5"><rect x="0" y="-45" width="16" height="45"/><rect x="27" y="-91" width="16" height="91"/><rect x="54" y="-60" width="16" height="60"/><rect x="81" y="-120" width="16" height="120"/><rect x="108" y="-74" width="16" height="74"/><rect x="135" y="-105" width="16" height="105"/><rect x="162" y="-50" width="16" height="50"/><rect x="189" y="-135" width="16" height="135"/><rect x="216" y="-82" width="16" height="82"/><rect x="243" y="-117" width="16" height="117"/><rect x="270" y="-66" width="16" height="66"/><rect x="297" y="-98" width="16" height="98"/><rect x="324" y="-130" width="16" height="130"/><rect x="351" y="-89" width="16" height="89"/><rect x="378" y="-112" width="16" height="112"/><rect x="405" y="-59" width="16" height="59"/><rect x="432" y="-122" width="16" height="122"/><rect x="459" y="-95" width="16" height="95"/></g></g>
      <g transform="translate(540 168)"><rect width="220" height="176" fill="#0c222c" stroke="#24535e"/><text x="15" y="24" fill="#d8f4ef" font-family="sans-serif" font-size="15" font-weight="700">Event mix</text><circle cx="104" cy="98" r="48" fill="none" stroke="#49dcc8" stroke-width="18" stroke-dasharray="105 196" transform="rotate(-90 104 98)"/><circle cx="104" cy="98" r="48" fill="none" stroke="#5798ff" stroke-width="18" stroke-dasharray="66 235" stroke-dashoffset="-109" transform="rotate(-90 104 98)"/><circle cx="104" cy="98" r="48" fill="none" stroke="#bd8cff" stroke-width="18" stroke-dasharray="42 259" stroke-dashoffset="-179" transform="rotate(-90 104 98)"/><text x="79" y="104" fill="#edf9f8" font-family="sans-serif" font-size="19" font-weight="700">100%</text></g>
      <g transform="translate(0 362)"><rect width="760" height="88" fill="#0c222c" stroke="#24535e"/><text x="15" y="24" fill="#d8f4ef" font-family="sans-serif" font-size="15" font-weight="700">Recent game events</text><g fill="#9dc4ca" font-family="monospace" font-size="10"><text x="15" y="50">14:42:18</text><text x="112" y="50">AINO</text><text x="210" y="50">RELAY ACTIVATED</text><text x="540" y="50">NORTHSTAR</text><text x="685" y="50" fill="#49dcc8">+125</text><text x="15" y="70">14:41:53</text><text x="112" y="70">LEO</text><text x="210" y="70">ENEMY ELIMINATED</text><text x="540" y="70">NORTHSTAR</text><text x="685" y="70" fill="#49dcc8">+45</text></g></g>
    </g>
  </g>
  <text x="55" y="670" fill="#87adb5" font-family="monospace" font-size="14">TYPED DATA / FILTERED EVENTS / RESPONSIVE OPERATIONS UI</text>
