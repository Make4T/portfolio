    <rect x="405" y="270" width="90" height="182" rx="14" fill="#171334" stroke="#b9a6ff"/><text x="421" y="343" fill="#d7ceff" font-size="16">REST</text><text x="414" y="370" fill="#d7ceff" font-size="16">API</text>
    <rect x="635" y="287" width="176" height="148" rx="14" fill="#0c1122" stroke="#8d73e7"/><ellipse cx="723" cy="328" rx="57" ry="18" fill="#32275d" stroke="#c5b5ff"/><path d="M666 328v48c0 10 25 18 57 18s57-8 57-18v-48" fill="#251d49" stroke="#c5b5ff"/><path d="M666 352c0 10 25 18 57 18s57-8 57-18" fill="none" stroke="#c5b5ff"/><text x="692" y="415" fill="#8f9aaa" font-size="14">SQLITE</text>
