<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" role="img" aria-labelledby="title desc">
  <title id="title">Game Session Hub</title><desc id="desc">A full stack game lobby interface connected to an API and SQLite database.</desc>
