    <filter id="glow"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="720" fill="url(#bg)"/><rect width="900" height="720" fill="url(#grid)"/>
  <text x="58" y="78" fill="#beaaff" font-family="monospace" font-size="18" letter-spacing="4">C# / .NET // GAME SESSION API</text>
