<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">Winter Survival branching story map</title>
  <desc id="description">A stylized map of connected interactive-fiction passages in a winter survival story.</desc>
  <defs>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M 42 0 L 0 0 0 42" fill="none" stroke="#1b475c" stroke-width="1" opacity=".45"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="760" fill="#06131d"/>
  <rect width="1200" height="760" fill="url(#grid)"/>
  <text x="72" y="96" fill="#87e5f0" font-family="monospace" font-size="24" letter-spacing="5">INTERACTIVE FICTION / TWINE 2</text>
  <text x="72" y="156" fill="#eef8fb" font-family="Arial, sans-serif" font-size="62" font-weight="700">WINTER SURVIVAL</text>
  <text x="75" y="193" fill="#8eaab8" font-family="monospace" font-size="22">46 PASSAGES · HARLOWE · BRANCHING NARRATIVE</text>
  <g fill="none" stroke="#4bd7e8" stroke-width="3" opacity=".42">
    <path d="M185 315 C300 315 310 390 410 390"/><path d="M185 315 C300 315 305 505 410 505"/>
    <path d="M490 390 C590 390 610 330 715 330"/><path d="M490 390 C595 390 610 460 715 460"/>
    <path d="M490 505 C605 505 620 590 715 590"/><path d="M790 330 C895 330 900 405 1000 405"/>
    <path d="M790 460 C895 460 900 405 1000 405"/><path d="M790 590 C900 590 905 505 1000 505"/>
  </g>
  <g filter="url(#glow)"><circle cx="165" cy="315" r="18" fill="#61e5a1"/><circle cx="165" cy="315" r="6" fill="#06131d"/></g>
  <g font-family="Arial, sans-serif" font-size="20" font-weight="700">
    <g><rect x="120" y="350" width="128" height="56" rx="8" fill="#102a37" stroke="#4bd7e8"/><text x="143" y="384" fill="#ddecf0">Radio signal</text></g>
    <g><rect x="370" y="362" width="150" height="56" rx="8" fill="#102a37" stroke="#4bd7e8"/><text x="399" y="396" fill="#ddecf0">Crash site</text></g>
    <g><rect x="360" y="477" width="170" height="56" rx="8" fill="#102a37" stroke="#4bd7e8"/><text x="380" y="511" fill="#ddecf0">Search supplies</text></g>
    <g><rect x="675" y="302" width="155" height="56" rx="8" fill="#102a37" stroke="#4bd7e8"/><text x="701" y="336" fill="#ddecf0">Check vehicle</text></g>
    <g><rect x="675" y="432" width="155" height="56" rx="8" fill="#102a37" stroke="#4bd7e8"/><text x="696" y="466" fill="#ddecf0">Forest route</text></g>
    <g><rect x="675" y="562" width="155" height="56" rx="8" fill="#102a37" stroke="#4bd7e8"/><text x="701" y="596" fill="#ddecf0">Rest / recover</text></g>
    <g><rect x="960" y="377" width="145" height="56" rx="8" fill="#153641" stroke="#61e5a1"/><text x="990" y="411" fill="#e4fff0">Outcome A</text></g>
    <g><rect x="960" y="477" width="145" height="56" rx="8" fill="#153641" stroke="#61e5a1"/><text x="990" y="511" fill="#e4fff0">Outcome B</text></g>
  </g>
  <text x="72" y="690" fill="#62818f" font-family="monospace" font-size="18">CHOICES → CONSEQUENCES → SURVIVAL</text>
</svg>
