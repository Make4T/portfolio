<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">UE Multiplayer Interaction Lab replication flow</title>
  <desc id="description">A server-authoritative Unreal Engine interaction flow: a client requests an Energy Node interaction, the server validates range, then replicated state updates the listen server and remote client.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071822"/><stop offset=".55" stop-color="#0b2b35"/><stop offset="1" stop-color="#111d3e"/></linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#67e5ef" stroke-opacity=".065"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity=".32"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 10 3 0 6z" fill="#63e6f0"/></marker>
  </defs>
  <rect width="1200" height="760" fill="url(#background)"/><rect width="1200" height="760" fill="url(#grid)"/>
  <text x="62" y="74" fill="#67e5ef" font-family="ui-monospace,Consolas,monospace" font-size="18" font-weight="700" letter-spacing="3">UNREAL ENGINE 5.8 / MULTIPLAYER REPLICATION</text>
  <text x="62" y="128" fill="#f1fbff" font-family="Arial,sans-serif" font-size="38" font-weight="700">Server-authoritative interaction</text>
  <text x="62" y="162" fill="#afc9d3" font-family="Arial,sans-serif" font-size="18">Listen server · Server RPC · range validation · replicated state · OnRep</text>
  <g filter="url(#shadow)">
    <rect x="66" y="254" width="258" height="224" rx="20" fill="#0a202a" stroke="#2d7680" stroke-width="2"/>
    <circle cx="118" cy="310" r="25" fill="#56dfe9"/><path d="M108 312h20m-10-10v20" stroke="#06202a" stroke-width="5" stroke-linecap="round"/>
    <text x="158" y="306" fill="#eafaff" font-family="Arial,sans-serif" font-size="22" font-weight="700">Remote client</text>
    <text x="98" y="365" fill="#9fc0ca" font-family="ui-monospace,Consolas,monospace" font-size="15">1. Aim at Energy Node</text>
    <text x="98" y="397" fill="#9fc0ca" font-family="ui-monospace,Consolas,monospace" font-size="15">2. Press E</text>
    <rect x="98" y="426" width="194" height="30" rx="15" fill="#173c4a"/><text x="119" y="447" fill="#70eaf3" font-family="ui-monospace,Consolas,monospace" font-size="13">ServerInteract RPC</text>
    <path d="M324 366h106" fill="none" stroke="#63e6f0" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="335" y="342" fill="#70eaf3" font-family="ui-monospace,Consolas,monospace" font-size="13">request</text>
    <rect x="438" y="222" width="326" height="306" rx="22" fill="#102842" stroke="#8279ff" stroke-width="3"/>
    <text x="478" y="280" fill="#b9b2ff" font-family="ui-monospace,Consolas,monospace" font-size="15" font-weight="700">AUTHORITY / LISTEN SERVER</text>
    <text x="478" y="326" fill="#f3f2ff" font-family="Arial,sans-serif" font-size="27" font-weight="700">Validate → mutate</text>
    <path d="M478 358h244" stroke="#596594" stroke-width="2"/>
    <circle cx="494" cy="394" r="7" fill="#7c83ff"/><text x="514" y="400" fill="#cad0ec" font-family="Arial,sans-serif" font-size="17">Validate target and range</text>
    <circle cx="494" cy="434" r="7" fill="#7c83ff"/><text x="514" y="440" fill="#cad0ec" font-family="Arial,sans-serif" font-size="17">Set ChargePercent + activation count</text>
    <circle cx="494" cy="474" r="7" fill="#7c83ff"/><text x="514" y="480" fill="#cad0ec" font-family="Arial,sans-serif" font-size="17">Replicate shared state</text>
    <path d="M764 366h92" fill="none" stroke="#63e6f0" stroke-width="4" marker-end="url(#arrow)"/><text x="775" y="342" fill="#70eaf3" font-family="ui-monospace,Consolas,monospace" font-size="13">state</text>
    <rect x="864" y="254" width="270" height="224" rx="20" fill="#0a202a" stroke="#2d7680" stroke-width="2"/>
    <circle cx="916" cy="310" r="25" fill="#4de0a0"/><path d="m905 310 8 8 15-18" fill="none" stroke="#06241a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="956" y="306" fill="#eafaff" font-family="Arial,sans-serif" font-size="22" font-weight="700">All clients</text>
    <text x="896" y="365" fill="#9fc0ca" font-family="ui-monospace,Consolas,monospace" font-size="15">OnRep_ChargeState</text>
    <text x="896" y="397" fill="#9fc0ca" font-family="ui-monospace,Consolas,monospace" font-size="15">Update light, label, HUD</text>
    <rect x="896" y="426" width="204" height="30" rx="15" fill="#163f35"/><text x="921" y="447" fill="#70f0b5" font-family="ui-monospace,Consolas,monospace" font-size="13">Charge 100 · Activations +1</text>
  </g>
  <rect x="66" y="584" width="1068" height="92" rx="18" fill="#0a1d27" stroke="#284f5c" stroke-width="2"/>
  <text x="94" y="620" fill="#67e5ef" font-family="ui-monospace,Consolas,monospace" font-size="14" font-weight="700" letter-spacing="2">VERIFICATION</text>
  <text x="94" y="653" fill="#d4e8ee" font-family="Arial,sans-serif" font-size="18">2-player PIE: remote client receives the authority-owned Energy Node state through OnRep.</text>
</svg>
